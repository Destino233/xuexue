name: CI

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

jobs:
  quality:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "26"
      - uses: gradle/actions/setup-gradle@v4
      - name: Cache MuPDF Java build
        uses: actions/cache@v4
        with:
          path: |
            .mupdf
            ~/.cache/xuexue/mupdf
          key: mupdf-java-1.27.2-linux-x86-64
      - name: Static analysis
        run: ./gradlew --no-daemon ktlintCheck detektMainDesktop detektTestDesktop
      - name: Tests and coverage
        run: ./gradlew --no-daemon desktopTest koverXmlReport koverHtmlReport
      - name: Upload coverage report
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: coverage-report
          path: build/reports/kover
          if-no-files-found: error
